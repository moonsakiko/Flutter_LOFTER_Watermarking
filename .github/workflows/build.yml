name: Build Android App
on:
  workflow_dispatch:

env:
  FILE_NAME: "Lofter_Watermark_Remover"
  APP_LABEL: "LOFTER去水印神器"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_fixer
          fi

      # 👇👇👇 【修正版】精准定位 android { 块 👇👇👇
      - name: Nuclear Fix for Android Build
        run: |
          # 1. 使用 Python 脚本精细修改 build.gradle
          python3 -c "
          import os

          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          # 策略A：如果已经开启混淆，强制关闭
          content = content.replace('minifyEnabled true', 'minifyEnabled false')
          content = content.replace('shrinkResources true', 'shrinkResources false')

          # 策略B：如果没写混淆配置，强制注入关闭命令 (插在 release 签名配置后面)
          if 'minifyEnabled' not in content:
              content = content.replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.release\n            minifyEnabled false\n            shrinkResources false')

          # 策略C：注入 noCompress (关键修正：插在 android { 紧后面，而不是文件末尾)
          if 'aaptOptions' not in content:
              # 替换 'android {' 为 'android { \n aaptOptions { noCompress "tflite" }'
              content = content.replace('android {', 'android {\n    aaptOptions {\n        noCompress \"tflite\"\n    }\n')

          with open(gradle_path, 'w') as f:
              f.write(content)
          print('✅ 已修正 build.gradle 配置 (精准注入)')
          "

          # 2. 修复 Kotlin 版本
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 3. 修复 MinSDK
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          
          # 4. 修改 APP 中文名
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f:
              content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        # 此时已经强制关闭了资源压缩，放心构建
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ env.FILE_NAME }}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "build/app/outputs/flutter-apk/${{ env.FILE_NAME }}.apk"