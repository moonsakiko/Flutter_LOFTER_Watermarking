name: Flutter Manual Fix Build
on:
  workflow_dispatch:

env:
  ORG_NAME: "com.example"
  PROJECT_NAME: "lofter_fixer"
  APP_CHINESE_NAME: "LOFTER去水印"
  FILE_NAME: "LofterFixer_Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 使用最新版，保证 Gradle 引擎没问题
          flutter-version: '3.24.3'
          channel: 'stable'

      # =========================================================
      # 1. 生成骨架
      # =========================================================
      - name: Generate Scaffolding
        run: |
          rm -rf android
          flutter create . --org ${{ env.ORG_NAME }} --project-name ${{ env.PROJECT_NAME }} --platforms android -a kotlin
          echo "✅ 骨架已生成"

      # =========================================================
      # 2. 【核心】手动生成配置文件 (专门修复 gal 报错)
      # =========================================================
      - name: Manual Config Injection
        run: |
          # 1. 修复 "unknown property 'flutter'"
          # 手动创建 local.properties，明确告诉插件 Flutter 在哪
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "✅ local.properties 已强制生成"
          
          # 2. 修复 "compileSdkVersion is not specified"
          # 既然插件想找 ext 变量，我们就直接把这一段补丁贴到 build.gradle 最前面
          
          ROOT_GRADLE="android/build.gradle"
          
          # 创建一个临时文件，包含定义好的变量
          cat > config_patch.txt <<EOF
          // --- 手动注入的兼容性变量 (Fix for gal plugin) ---
          buildscript {
              ext {
                  buildToolsVersion = "34.0.0"
                  compileSdkVersion = 34
                  minSdkVersion = 24
                  targetSdkVersion = 34
                  ndkVersion = "26.1.10909125"
                  kotlin_version = "1.9.0"
              }
          }
          // ------------------------------------------------
          EOF
          
          # 把原文件拼接到补丁后面，相当于插在头部
          cat $ROOT_GRADLE >> config_patch.txt
          mv config_patch.txt $ROOT_GRADLE
          
          echo "✅ 根 build.gradle 已注入兼容变量"
          head -n 20 $ROOT_GRADLE

      # =========================================================
      # 3. 注入 TFLite 和 OpenCV 依赖
      # =========================================================
      - name: Inject App Dependencies
        run: |
          APP_GRADLE="android/app/build.gradle"
          
          # 注入依赖
          sed -i '/dependencies {/a \    implementation "org.tensorflow:tensorflow-lite:2.14.0"\n    implementation "org.tensorflow:tensorflow-lite-support:0.4.4"\n    implementation "com.quickbirdstudios:opencv:4.5.3.0"\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"' $APP_GRADLE
          
          # 注入 .so 处理
          sed -i '/android {/a \    packagingOptions {\n        pickFirst "lib/arm64-v8a/libc++_shared.so"\n        pickFirst "lib/armeabi-v7a/libc++_shared.so"\n    }' $APP_GRADLE
          
          # 修正 MinSDK
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' $APP_GRADLE
          
          echo "✅ APP 依赖注入完成"

      # =========================================================
      # 4. 注入业务代码
      # =========================================================
      - name: Inject Source Code
        run: |
          # 覆盖 Manifest
          cp -f android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # 覆盖 MainActivity
          mkdir -p android/app/src/main/kotlin/com/example/lofter_fixer/
          cp -f android_overlay/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt android/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt
          
          echo "✅ 业务代码注入完成"

      # =========================================================
      # 5. 打包
      # =========================================================
      - name: Generate Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label=".*"/android:label="${{ env.APP_CHINESE_NAME }}"/g' $MANIFEST

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: mv build/app/outputs/flutter-apk/app-release.apk ${{ env.FILE_NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: ${{ env.FILE_NAME }}.apk