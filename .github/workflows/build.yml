name: Lofter Repair App Build
on:
  workflow_dispatch:

env:
  APP_NAME: "LOFTER修复助手"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 1. 生成 Android 工程
      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_repair_app
          fi

      # 2. 核心：修改中文名
      - name: Set Chinese App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_NAME }}"/g' android/app/src/main/AndroidManifest.xml

      # 3. 核心：修复环境 (Kotlin + MinSDK)
      - name: Fix Android Environment
        run: |
          # 强制升级 Kotlin 到 1.9.0 以兼容新插件
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          # 强制 MinSDK 为 21
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle

      # 4. 核心：添加读取权限 (如果 Manifest 没写的话，这里通过脚本补刀，双保险)
      - name: Inject Permissions
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      # 5. 生成图标 (可选，如果你上传了 icon.png)
      - name: Generate Assets
        run: dart run flutter_launcher_icons || true

      # 6. 生成签名
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Me, OU=Me, O=Me, L=Me, S=Me, C=CN" \
            -storepass android -keypass android
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      # 7. 打包 (Release + Arm64)
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      # 8. 重命名并上传
      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ env.APP_NAME }}.apk"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_Install_Package
          path: "build/app/outputs/flutter-apk/${{ env.APP_NAME }}.apk"