name: Flutter Cloud Total Overwrite
on:
  workflow_dispatch:

env:
  ORG_NAME: "com.example"
  PROJECT_NAME: "lofter_fixer"
  APP_CHINESE_NAME: "LOFTER去水印"
  FILE_NAME: "LofterFixer_Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # =========================================================
      # 1. 生成骨架 (获取目录结构)
      # =========================================================
      - name: Generate Scaffolding
        run: |
          rm -rf android
          flutter create . --org ${{ env.ORG_NAME }} --project-name ${{ env.PROJECT_NAME }} --platforms android -a kotlin
          echo "✅ 骨架已生成"

      # =========================================================
      # 2. 升级引擎 (文本修改，避开 Gradle 9)
      # =========================================================
      - name: Upgrade Gradle Wrapper Text
        run: |
          PROP_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/gradle-.*-all.zip/gradle-8.0-all.zip/g' $PROP_FILE
          echo "✅ Gradle Wrapper 指向 8.0"

      # =========================================================
      # 3. 重写 settings.gradle (定义插件版本)
      # =========================================================
      - name: Overwrite settings.gradle
        run: |
          cat > android/settings.gradle <<EOF
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }
              settings.ext.flutterSdkPath = flutterSdkPath()
              includeBuild("\${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              plugins {
                  id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
                  id "com.android.application" version "8.1.0" apply false
                  id "org.jetbrains.kotlin.android" version "1.9.0" apply false
              }
          }
          include ":app"
          EOF
          echo "✅ settings.gradle 全量重写完成"

      # =========================================================
      # 4. 重写根 build.gradle (清理旧配置)
      # =========================================================
      - name: Overwrite Root build.gradle
        run: |
          cat > android/build.gradle <<EOF
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "\${rootProject.buildDir}/\${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "✅ 根 build.gradle 全量重写完成"

      # =========================================================
      # 5. 重写 APP build.gradle (关键！统一插件ID + 注入依赖)
      # =========================================================
      - name: Overwrite App build.gradle
        run: |
          # 注意：这里直接使用了新版插件 ID org.jetbrains.kotlin.android
          # 这就解决了 "Plugin kotlin-android not found" 的报错
          cat > android/app/build.gradle <<EOF
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }
          
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }
          
          android {
              namespace "${{ env.ORG_NAME }}.${{ env.PROJECT_NAME }}"
              compileSdkVersion 34
              ndkVersion flutter.ndkVersion
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          
              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }
          
              defaultConfig {
                  applicationId "${{ env.ORG_NAME }}.${{ env.PROJECT_NAME }}"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
          
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              
              packagingOptions {
                  pickFirst 'lib/arm64-v8a/libc++_shared.so'
                  pickFirst 'lib/armeabi-v7a/libc++_shared.so'
              }
          }
          
          flutter {
              source '../..'
          }
          
          dependencies {
              implementation 'org.tensorflow:tensorflow-lite:2.14.0'
              implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
              implementation 'com.quickbirdstudios:opencv:4.5.3.0'
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"
          }
          EOF
          echo "✅ APP build.gradle 全量重写完成 (含 TFLite/OpenCV)"

      # =========================================================
      # 6. 注入业务代码
      # =========================================================
      - name: Inject Source Code
        run: |
          # 覆盖 Manifest
          cp -f android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # 覆盖 MainActivity
          mkdir -p android/app/src/main/kotlin/com/example/lofter_fixer/
          cp -f android_overlay/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt android/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt
          echo "✅ 业务代码注入完成"

      # =========================================================
      # 7. 打包流程
      # =========================================================
      - name: Generate Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label=".*"/android:label="${{ env.APP_CHINESE_NAME }}"/g' $MANIFEST

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: mv build/app/outputs/flutter-apk/app-release.apk ${{ env.FILE_NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: ${{ env.FILE_NAME }}.apk