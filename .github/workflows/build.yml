name: Lofter Remover Build
on:
  workflow_dispatch:

env:
  APP_LABEL: "LOFTER去水印"
  FILE_NAME: "Lofter_Remover"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_remover
          fi

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f: content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f: f.write(new_content)
          "

      - name: Fix Android Environment (Line-by-Line Rewrite)
        run: |
          echo "🔧 Fixing Android Build Configuration..."
          
          # 1. 修复 Kotlin 版本 (settings.gradle & build.gradle)
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 2. 【核心】使用 Python 逐行扫描并重写 android/app/build.gradle
          python3 -c "
          import os
          
          file_path = 'android/app/build.gradle'
          print(f'Processing {file_path}...')
          
          if os.path.exists(file_path):
              with open(file_path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              
              new_lines = []
              found_sdk = False
              
              for line in lines:
                  # 去除首尾空白，检查是否以 minSdkVersion 开头
                  if line.strip().startswith('minSdkVersion'):
                      print(f'  🎯 Found target line: {line.strip()}')
                      # 计算原有的缩进 (空格)
                      indent = line[:line.find('minSdkVersion')]
                      # 替换为 26
                      new_lines.append(f'{indent}minSdkVersion 26\n')
                      print(f'  ✅ Replaced with: {indent}minSdkVersion 26')
                      found_sdk = True
                  else:
                      new_lines.append(line)
              
              # 追加 tflite 防压缩配置
              new_lines.append('\nandroid { aaptOptions { noCompress \"tflite\" } }\n')
              
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.writelines(new_lines)
                  
              if not found_sdk:
                  print('❌ WARNING: Could not find minSdkVersion line to replace!')
              else:
                  print('✅ Successfully updated minSdkVersion.')

              # 【关键】打印文件内容以供验证
              print('\n--- [DEBUG] Content of android/app/build.gradle ---')
              print(''.join(new_lines))
              print('--- [DEBUG] End of File ---')
          else:
              print(f'❌ Error: File {file_path} not found.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "${{ env.FILE_NAME }}.apk"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "${{ env.FILE_NAME }}.apk"