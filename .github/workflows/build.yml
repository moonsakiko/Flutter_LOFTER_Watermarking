name: Lofter Remover Build
on:
  workflow_dispatch:

env:
  APP_LABEL: "LOFTER去水印"
  FILE_NAME: "Lofter_Remover"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_remover
          fi

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f: content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f: f.write(new_content)
          "

      - name: Fix Android Environment (Regex Force Mode)
        run: |
          echo "🔧 Fixing Android Build Configuration with Regex..."
          
          python3 -c "
          import re
          import os
          
          gradle_path = 'android/app/build.gradle'
          
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()
              
              # 1. 暴力正则替换 minSdkVersion (不管它原本是变量还是数字)
              # 匹配 minSdkVersion 后面跟着空格和任意字符，直到行尾
              content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 26', content)
              
              # 2. 确保添加 tflite 防压缩配置
              if 'noCompress' not in content:
                  content += '\nandroid { aaptOptions { noCompress \"tflite\" } }\n'
              
              with open(gradle_path, 'w') as f:
                  f.write(content)
              
              print('✅ build.gradle modified successfully.')
          else:
              print('❌ Error: android/app/build.gradle not found!')
          "

          # 3. 修复 Kotlin 版本
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 4. 【关键】打印文件内容以供查验 (Debug)
          echo "👇👇👇 CONTENT OF android/app/build.gradle 👇👇👇"
          cat android/app/build.gradle
          echo "👆👆👆 END OF CONTENT 👆👆👆"

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "${{ env.FILE_NAME }}.apk"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "${{ env.FILE_NAME }}.apk"