name: Lofter Remover Build
on:
  workflow_dispatch:

env:
  APP_LABEL: "LOFTER去水印"
  FILE_NAME: "Lofter_Remover"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_remover
          fi

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f: content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f: f.write(new_content)
          "

      - name: Fix Android Environment (Python Safe Mode)
        run: |
          echo "🔧 Fixing Android Build Configuration with Python..."
          
          # 1. 使用 Python 精确修改 build.gradle (防止 sed 误伤)
          python3 -c "
          import os
          
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  lines = f.readlines()
              
              with open(gradle_path, 'w') as f:
                  for line in lines:
                      # 去除首尾空格便于判断
                      s = line.strip()
                      # 只修改以 minSdkVersion 开头且不是注释的行
                      if s.startswith('minSdkVersion') and not s.startswith('//'):
                          # 保持原有缩进 (通常是8个空格)
                          f.write('        minSdkVersion 26\n')
                      else:
                          f.write(line)
              
              # 在文件末尾追加 tflite 防压缩配置
              with open(gradle_path, 'a') as f:
                  f.write('\nandroid { aaptOptions { noCompress \"tflite\" } }\n')
          "

          # 2. 修复 Kotlin 版本 (settings.gradle)
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          
          # 3. 修复 Kotlin 版本 (build.gradle)
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 4. 打印文件内容以供检查 (如果再次失败，可以看日志)
          echo "--- android/app/build.gradle HEAD ---"
          head -n 50 android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "${{ env.FILE_NAME }}.apk"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "${{ env.FILE_NAME }}.apk"