name: Flutter Build Release
on:
  workflow_dispatch:

env:
  APP_CHINESE_NAME: "LOFTER去水印"
  FILE_NAME: "LofterFixer_Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      # 1. 生成图标
      - name: Generate Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      # 👇👇👇 【绝杀招】现场修复缺失的 Gradle 引擎 👇👇👇
      # 这步会重新生成 gradle-wrapper.jar 和 properties，强制使用 8.0 版本
      - name: Fix Gradle Wrapper
        run: |
          cd android
          # 使用系统 Gradle 强制生成 8.0 版本的 wrapper 文件
          gradle wrapper --gradle-version 8.0 --distribution-type all
          # 赋予执行权限
          chmod +x gradlew
          cd ..
      # 👆👆👆 这步将彻底解决 "版本不匹配" 问题 👆👆👆

      # 2. 修改 APP 名称
      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label=".*"/android:label="${{ env.APP_CHINESE_NAME }}"/g' $MANIFEST

      # 3. 临时生成签名
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      # 4. 打包
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk ${{ env.FILE_NAME }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: ${{ env.FILE_NAME }}.apk