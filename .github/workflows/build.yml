name: Lofter Remover Build
on:
  workflow_dispatch:

env:
  APP_LABEL: "LOFTER去水印"
  FILE_NAME: "Lofter_Remover"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_remover
          fi

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f: content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f: f.write(new_content)
          "

      - name: Fix Android Environment (The Clean Way)
        run: |
          echo "🔧 Configuring Android Environment..."

          # 1. 【核心修复】通过 local.properties 覆盖 MinSDK
          # 这是官方推荐的方式，不用去改 build.gradle 代码，绝对安全！
          echo "flutter.minSdkVersion=26" >> android/local.properties
          
          # 2. 【TFLite修复】追加 noCompress 配置到 build.gradle 末尾
          # Gradle 允许追加多个 android {} 块，它们会自动合并，这样非常安全。
          echo "" >> android/app/build.gradle
          echo "android { aaptOptions { noCompress 'tflite' } }" >> android/app/build.gradle
          
          # 3. 【Kotlin修复】解决插件冲突
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle

          # 4. 打印 local.properties 确认修改
          echo "--- android/local.properties Content ---"
          cat android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "${{ env.FILE_NAME }}.apk"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "${{ env.FILE_NAME }}.apk"