name: Build Android App
on:
  workflow_dispatch:

env:
  FILE_NAME: "Lofter_Watermark_Remover"
  APP_LABEL: "LOFTER去水印神器"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_fixer
          fi

      # 👇👇👇 【修复核心】禁止压缩 tflite 文件 👇👇👇
      - name: Fix Android Config (NoCompress & MinSDK)
        run: |
          # 1. 注入 aaptOptions { noCompress 'tflite' }
          # 这段脚本会把配置插到 android { ... } 块里面
          sed -i '/android {/a \    aaptOptions {\n        noCompress "tflite"\n    }' android/app/build.gradle

          # 2. 修复 Kotlin 版本
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 3. 修复 MinSDK
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          
          # 4. 修改 APP 中文名
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f:
              content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Configure ProGuard Rules
        run: |
          echo "-dontwarn java.beans.**" > android/app/proguard-rules.pro
          echo "-dontwarn java.awt.**" >> android/app/proguard-rules.pro
          echo "-dontwarn org.yaml.snakeyaml.**" >> android/app/proguard-rules.pro
          echo "-keep class org.yaml.snakeyaml.** { *; }" >> android/app/proguard-rules.pro
          echo "-keep class com.ultralytics.** { *; }" >> android/app/proguard-rules.pro
          # 👇 增加 TensorFlow 保护规则
          echo "-keep class org.tensorflow.** { *; }" >> android/app/proguard-rules.pro

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ env.FILE_NAME }}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "build/app/outputs/flutter-apk/${{ env.FILE_NAME }}.apk"