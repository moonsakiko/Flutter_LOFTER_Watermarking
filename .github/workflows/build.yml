name: Flutter Build LOFTER Remover
on:
  workflow_dispatch:

env:
  APP_NAME: "LOFTER去水印"
  # 请确保你的 assets/models/best_float16.tflite 已经上传到仓库！

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            # 使用蛇形命名法
            flutter create . --platforms android --project-name lofter_remover
          fi

      # 🔧 修复环境 (关键步骤，解决新插件冲突)
      - name: Fix Android Environment
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          
          # 这一步是为了防止 TFLite 插件编译时的压缩问题
          echo "android.enableR8=true" >> android/gradle.properties

      # 🏷️ 修改中文名
      - name: Change App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_NAME }}"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      # 这里演示打 Debug 包 (免签名，适合快速测试)
      # 如果你需要正式签名，请参考上一篇教程恢复 Keystore 部分
      - name: Build APK (Debug)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lofter-remover-debug
          path: build/app/outputs/flutter-apk/app-debug.apk