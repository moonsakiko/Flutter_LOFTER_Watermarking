name: Build LOFTER Repair APP
on:
  workflow_dispatch:

env:
  APP_NAME: "LOFTER图片修复"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 1. 创建安卓工程骨架
      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_repair_tool
          fi

      # 2. 修改应用名和配置
      - name: Config App
        run: |
          # 修改中文名
          sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_NAME }}"/g' android/app/src/main/AndroidManifest.xml
          
          # 修正 Kotlin 版本 (针对新插件兼容性)
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 修正 MinSDK (ultralytics 要求较高)
          sed -i 's/minSdkVersion.*/minSdkVersion 24/g' android/app/build.gradle

      # 3. 安装依赖
      - name: Install Dependencies
        run: flutter pub get

      # 4. 生成签名 (必须，否则无法安装)
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Repair, OU=Repair, O=Repair, L=Repair, S=Repair, C=CN" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      # 5. 打包 Release APK
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --no-shrink

      # 6. 上传
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOFTER_Repair_APP
          path: build/app/outputs/flutter-apk/app-release.apk