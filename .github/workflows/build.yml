name: Build Android App
on:
  workflow_dispatch:

env:
  FILE_NAME: "Lofter_Watermark_Remover"
  APP_LABEL: "LOFTER去水印神器"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name lofter_fixer
          fi

      # 👇👇👇 【核弹级修复】关闭混淆，强制不压缩 tflite 👇👇👇
      - name: Nuclear Fix for Android Build
        run: |
          # 1. 使用 Python 脚本精细修改 build.gradle
          # 目标：设置 minifyEnabled false, shrinkResources false, 并添加 noCompress
          python3 -c "
          import os

          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          # 关闭混淆和资源压缩 (解决 AI 秒挂问题)
          content = content.replace('minifyEnabled true', 'minifyEnabled false')
          content = content.replace('shrinkResources true', 'shrinkResources false')

          # 确保 tflite 不被压缩
          if 'aaptOptions' not in content:
              no_compress_block = '''
              aaptOptions {
                  noCompress 'tflite'
              }
              '''
              # 插在 android { 内部最后
              last_brace = content.rfind('}')
              content = content[:last_brace] + no_compress_block + content[last_brace:]

          with open(gradle_path, 'w') as f:
              f.write(content)
          print('✅ 已强制关闭代码混淆并设置 noCompress')
          "

          # 2. 修复 Kotlin 版本
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          
          # 3. 修复 MinSDK
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          
          # 4. 修改 APP 中文名
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          with open('$MANIFEST', 'r', encoding='utf-8') as f:
              content = f.read()
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"${{ env.APP_LABEL }}\"', content)
          with open('$MANIFEST', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        # 移除 --no-tree-shake-icons，因为我们已经全局关闭了 shrinkResources
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ env.FILE_NAME }}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}_Install_Package
          path: "build/app/outputs/flutter-apk/${{ env.FILE_NAME }}.apk"