name: Flutter 3.24 Modern Build
on:
  workflow_dispatch:

env:
  ORG_NAME: "com.example"
  PROJECT_NAME: "lofter_fixer"
  APP_CHINESE_NAME: "LOFTER去水印"
  FILE_NAME: "LofterFixer_Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          # Flutter 3.24 + Gradle 8 需要 Java 17
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 👇 关键点：使用新版 Flutter，它天生支持 Gradle 8 和 Kotlin 1.9
          flutter-version: '3.24.3'
          channel: 'stable'

      # =========================================================
      # 1. 生成现代骨架 (Native Gradle 8.0 + Kotlin 1.9)
      # =========================================================
      - name: Generate Modern Scaffolding
        run: |
          rm -rf android
          # 使用新版 Flutter 生成项目，自动就是最新标准，无需修补
          flutter create . --org ${{ env.ORG_NAME }} --project-name ${{ env.PROJECT_NAME }} --platforms android -a kotlin
          echo "✅ Flutter 3.24 标准骨架已生成"

      # =========================================================
      # 2. 注入原生依赖 (只插入，不覆盖，保证安全)
      # =========================================================
      - name: Inject Native Dependencies
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # 1. 修正 MinSDK (TFLite 需要 24)
          # Flutter 3.24 默认写法是 flutter.minSdkVersion，我们直接改写
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' $BUILD_GRADLE
          
          # 2. 注入依赖库
          # 我们在 "dependencies {" 这一行后面，插入我们的依赖
          # 这样就不会破坏 Flutter 原有的依赖结构
          sed -i '/dependencies {/a \    implementation "org.tensorflow:tensorflow-lite:2.14.0"\n    implementation "org.tensorflow:tensorflow-lite-support:0.4.4"\n    implementation "com.quickbirdstudios:opencv:4.5.3.0"\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"' $BUILD_GRADLE
          
          # 3. 解决 OpenCV 的 .so 文件冲突
          # 在 android { ... } 块的最后添加 packagingOptions
          # 简单的做法是直接追加到文件末尾，但在 android {} 闭包外追加可能会报错
          # 我们尝试用 sed 在 buildTypes 后面插入
          sed -i '/buildTypes {/i \    packagingOptions {\n        pickFirst "lib/arm64-v8a/libc++_shared.so"\n        pickFirst "lib/armeabi-v7a/libc++_shared.so"\n    }' $BUILD_GRADLE
          
          echo "✅ 依赖库注入完成"
          # 打印出来检查一下
          cat $BUILD_GRADLE

      # =========================================================
      # 3. 注入业务代码 (灵魂覆盖)
      # =========================================================
      - name: Inject Source Code
        run: |
          # 覆盖 Manifest
          cp -f android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # 覆盖 MainActivity
          # 确保目录存在
          mkdir -p android/app/src/main/kotlin/com/example/lofter_fixer/
          cp -f android_overlay/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt android/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt
          
          echo "✅ 核心代码注入完毕"

      # =========================================================
      # 4. 常规打包流程
      # =========================================================
      - name: Generate Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label=".*"/android:label="${{ env.APP_CHINESE_NAME }}"/g' $MANIFEST

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: mv build/app/outputs/flutter-apk/app-release.apk ${{ env.FILE_NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: ${{ env.FILE_NAME }}.apk