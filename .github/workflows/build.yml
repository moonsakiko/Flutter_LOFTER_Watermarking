FILE: .github/workflows/build.yml
name: Build Android App (Clean)
on:
  workflow_dispatch:

# 👇 全局变量 (APP中文名)
env:
  APP_CHINESE_NAME: "Lofter去水印"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 1. 恢复签名密钥
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      # 2. 修改 APP 显示名称 (可选，虽然我们在Manifest里写了，但这里可以双保险)
      - name: Set App Name
        run: |
          # 使用 sed 替换 AndroidManifest 中的 label
          sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_CHINESE_NAME }}"/g' android/app/src/main/AndroidManifest.xml

      # 3. 获取依赖并生成图标
      - name: Install Dependencies
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      # 4. 打包 Release
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      # 5. 上传
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lofter_Fixer_Release
          path: build/app/outputs/flutter-apk/app-release.apk