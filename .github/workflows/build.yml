name: Flutter 3.22 Goldilocks Build
on:
  workflow_dispatch:

env:
  ORG_NAME: "com.example"
  PROJECT_NAME: "lofter_fixer"
  APP_CHINESE_NAME: "LOFTER去水印"
  FILE_NAME: "LofterFixer_Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          # Flutter 3.22 + Gradle 8 需要 Java 17
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 👇👇👇 核心：使用黄金版本 3.22.2 👇👇👇
          # 它既支持 Gradle 8 (适配新插件)，又保留了旧变量 (适配 gal)
          flutter-version: '3.22.2'
          channel: 'stable'

      # =========================================================
      # 1. 生成骨架 (原汤化原食)
      # =========================================================
      - name: Generate Scaffolding
        run: |
          rm -rf android
          # 3.22.2 生成的骨架默认就是 AGP 8.1 + Kotlin 1.9
          flutter create . --org ${{ env.ORG_NAME }} --project-name ${{ env.PROJECT_NAME }} --platforms android -a kotlin
          echo "✅ 骨架已生成"

      # =========================================================
      # 2. 注入依赖 (仅修改 app/build.gradle)
      # =========================================================
      - name: Inject Dependencies
        run: |
          APP_BUILD_GRADLE="android/app/build.gradle"
          
          # 1. 注入 TFLite 和 OpenCV 依赖
          # 使用 sed 在 dependencies { 后面追加内容
          sed -i '/dependencies {/a \    implementation "org.tensorflow:tensorflow-lite:2.14.0"\n    implementation "org.tensorflow:tensorflow-lite-support:0.4.4"\n    implementation "com.quickbirdstudios:opencv:4.5.3.0"\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"' $APP_BUILD_GRADLE
          
          # 2. 注入 packagingOptions (解决 .so 冲突)
          # 在 android { 块内部追加
          sed -i '/android {/a \    packagingOptions {\n        pickFirst "lib/arm64-v8a/libc++_shared.so"\n        pickFirst "lib/armeabi-v7a/libc++_shared.so"\n    }' $APP_BUILD_GRADLE
          
          # 3. 修正 MinSDK (TFLite 需要 24)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $APP_BUILD_GRADLE
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' $APP_BUILD_GRADLE
          
          echo "✅ 依赖库注入完成"

      # =========================================================
      # 3. 注入业务代码 (灵魂覆盖)
      # =========================================================
      - name: Inject Source Code
        run: |
          # 覆盖 Manifest
          cp -f android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # 覆盖 MainActivity
          mkdir -p android/app/src/main/kotlin/com/example/lofter_fixer/
          cp -f android_overlay/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt android/app/src/main/kotlin/com/example/lofter_fixer/MainActivity.kt
          
          echo "✅ 业务代码注入完毕"

      # =========================================================
      # 4. 常规打包流程
      # =========================================================
      - name: Generate Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set App Name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label=".*"/android:label="${{ env.APP_CHINESE_NAME }}"/g' $MANIFEST

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US" \
            -storepass android -keypass android
          
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and Upload
        run: mv build/app/outputs/flutter-apk/app-release.apk ${{ env.FILE_NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: ${{ env.FILE_NAME }}.apk