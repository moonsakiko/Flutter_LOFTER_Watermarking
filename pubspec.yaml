name: lofter_repair_app
description: A AI-powered watermark remover for LOFTER images.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 🤖 核心 AI 能力
  ultralytics_yolo: ^0.1.3 # 确保检查最新版本，用于加载 YOLO 模型
  
  # 🖼️ 图像处理 (替代 OpenCV)
  image: ^4.1.7         # 纯 Dart 图像库，处理裁剪、缩放、粘贴
  
  # 📂 文件与相册选择
  image_picker: ^1.0.7  # 单张选择
  file_picker: ^8.0.0   # 文件夹/批量选择
  path_provider: ^2.1.2 # 获取路径
  permission_handler: ^11.3.0 # 权限申请
  
  # 🛠️ 状态管理与工具
  provider: ^6.1.1      # 简单的状态管理
  intl: ^0.19.0         # 时间格式化
  uuid: ^4.3.3          # 生成唯一ID
  
  # 🎨 UI 组件
  flutter_spinkit: ^5.2.0 # 加载动画
  google_fonts: ^6.1.0    # 字体(可选)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

# ⚙️ 自动化配置
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash.png"

# 📦 资源注册
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/