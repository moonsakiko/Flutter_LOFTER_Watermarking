name: lofter_fixer
description: LOFTER Watermark Remover
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI图标
  cupertino_icons: ^1.0.6
  # 图片选择
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  # 权限管理
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  # ❌ 已删除 fluttertoast，因为它会导致构建报错

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/best_float16.tflite
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 24