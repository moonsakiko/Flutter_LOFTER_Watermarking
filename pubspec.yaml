name: lofter_fixer
description: LOFTER Image Watermark Remover App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 👇👇👇 【换库】更底层、更稳定的引擎 👇👇👇
  tflite_flutter: ^0.10.4
  # ultralytics_yolo: 0.1.19  <-- 删掉它

  gal: ^2.3.0
  image: ^4.1.3
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/  # 确保 best_float16.tflite 在这里

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21