name: lofter_fixer
description: LOFTER Image Watermark Remover App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 🖼️ 核心处理库
  ultralytics_yolo: 0.1.19  # YOLO 模型加载
  image: ^4.1.3             # 图像像素级处理 (Resize, Crop, Paste)
  
  # 📂 文件与权限
  file_picker: ^6.1.1       # 文件选择
  path_provider: ^2.1.2     # 路径获取
  permission_handler: ^11.3.0 # 权限申请
  gal: ^2.3.0    # 保存图片到相册
  path: ^1.9.0              # 路径字符串处理

  # 🎨 UI 组件
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0   # 加载动画

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# 📦 资源注册
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/  # 注册模型文件夹

# 📱 图标配置 (可选)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21