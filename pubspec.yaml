name: lofter_repair_app
description: LOFTER图片去水印工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI图标
  cupertino_icons: ^1.0.2
  # 状态管理/UI增强
  google_fonts: ^6.1.0
  fluttertoast: ^8.2.4
  # 文件选择与权限
  file_picker: ^6.1.1
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  gallery_saver: ^2.3.2
  # 核心逻辑
  ultralytics_yolo: ^0.1.25
  image: ^4.1.3 # Dart版的OpenCV，用于像素操作

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # 注册模型资源
  assets:
    - assets/models/