name: lofter_repair_app
description: A AI-powered watermark remover for LOFTER images.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 👇 修正版本号，跟你的文档保持一致
  ultralytics_yolo: ^0.1.26
  
  # 🖼️ 图像处理
  image: ^4.1.7
  
  # 📂 缺失的库补在这里！
  gallery_saver: ^2.3.2   # <--- 之前漏了这一行！
  
  # 📂 其他依赖
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  provider: ^6.1.1
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # UI 组件
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/