name: lofter_repair_app
description: A AI-powered watermark remover for LOFTER images.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🤖 核心 AI
  ultralytics_yolo: ^0.1.26
  
  # 🖼️ 图像处理
  image: ^4.1.7
  
  # 📂 核心功能库
  gallery_saver: ^2.3.2   # 保存图片
  image_picker: ^1.0.7    # 选图
  file_picker: ^8.0.0     # 选文件夹
  path_provider: ^2.1.2   # 路径管理
  permission_handler: ^11.3.0 # 权限
  provider: ^6.1.1        # 状态管理
  intl: ^0.19.0           # 时间格式化
  uuid: ^4.3.3            # ID生成
  
  # 🎨 UI 组件
  flutter_spinkit: ^5.2.0 # 加载动画
  # ❌ 已删除 google_fonts 以解决冲突

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

# ⚙️ 图标配置
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

# 🌊 启动图配置
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash.png"

# 📦 资源注册
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/