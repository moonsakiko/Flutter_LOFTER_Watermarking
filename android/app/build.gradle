plugins {
    id "com.android.application"
    // 使用我们在 settings.gradle 里定义的 Kotlin 版本
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    // 👇 必须要有 namespace，否则 Gradle 8+ 会报错
    namespace "com.example.lofter_fixer"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.lofter_fixer"
        // 👇 必须是 24+，为了兼容 Gal 和 TFLite
        minSdkVersion 24 
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // ⚠️ 为了防止 OpenCV 被过度混淆导致崩溃，暂时关闭混淆
            // 如果你非常在意体积，可以改为 true 并添加复杂的混淆规则，但为了成功率建议 false
            minifyEnabled false 
            shrinkResources false 
        }
    }
    
    // 👇 解决 OpenCV 的 libc++_shared.so 冲突
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

flutter {
    source '../..'
}

dependencies {
    // 👇👇👇 你的所有原生依赖都在这里 👇👇👇
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'com.quickbirdstudios:opencv:4.5.3.0' 
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"
}